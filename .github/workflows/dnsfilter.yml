name: Build dnsfilter
on:
  schedule:
        - cron: '00 03 * * 0-6'
          timezone: "Asia/Jakarta"
  workflow_dispatch:
jobs:
  adguardfilter:
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install HostlistCompiler
        run: npm i -g @adguard/hostlist-compiler
      - name: Build Adguard list
        working-directory: .\Adguard-Filter
        run: |
          hostlist-compiler -c configuration5.json -o Adguardstylepc.txt
          hostlist-compiler -c configuration.json -o Adguardstyle.txt
          git add Adguardstyle.txt
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Build blocked-names
        working-directory: .\DNScrypt-Filter
        run: |
          py generate-domains-blocklist.py -o blocked-names.txt
          git add blocked-names.txt
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
      - name: git add
        run: |
          git add -u
          git commit -m "Auto update"
          git push
